services:
  homestay-erp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_BUSINESS_NAME=${NEXT_PUBLIC_BUSINESS_NAME:-Homestay Damai ERP}
      - NEXT_PUBLIC_DEFAULT_CHECKIN_TIME=${NEXT_PUBLIC_DEFAULT_CHECKIN_TIME:-15:00}
      - NEXT_PUBLIC_DEFAULT_CHECKOUT_TIME=${NEXT_PUBLIC_DEFAULT_CHECKOUT_TIME:-12:00}
      - NEXT_PUBLIC_SUPPORT_PHONE=${NEXT_PUBLIC_SUPPORT_PHONE:-60123456789}
